name: Build for Appetize.io

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # НОВЫЙ ШАГ: Принудительно включаем Xcode 16, чтобы понимать формат 77
      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project FlashcardsApp.xcodeproj -scheme FlashcardsApp

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project FlashcardsApp.xcodeproj \
            -scheme FlashcardsApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipMacroValidation \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Prepare Payload for Appetize
        run: |
          mkdir -p ${{ github.workspace }}/Payload
          cp -R ${{ github.workspace }}/build/FlashcardsApp.app ${{ github.workspace }}/Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashcardsApp
          path: ${{ github.workspace }}/Payload/
