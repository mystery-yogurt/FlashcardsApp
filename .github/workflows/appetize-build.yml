name: Build for Appetize.io

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build for iOS Simulator
        # Добавлено ONLY_ACTIVE_ARCH=NO для поддержки всех серверов Appetize
        run: |
          xcodebuild build \
            -project FlashcardsApp.xcodeproj \
            -scheme FlashcardsApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashcardsApp # Это будет название скачанного ZIP архива
          # Мы указываем сразу на папку .app, GitHub сам её запакует правильно!
          path: ${{ github.workspace }}/build/FlashcardsApp.app
