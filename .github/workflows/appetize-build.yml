name: Build for Appetize.io

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14 # Сервер Apple от GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project FlashcardsApp.xcodeproj \
            -scheme FlashcardsApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Zip the .app file
        run: |
          cd ${{ github.workspace }}/build
          zip -r FlashcardsApp.zip FlashcardsApp.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashcardsApp-Simulator-Build
          path: ${{ github.workspace }}/build/FlashcardsApp.zip
