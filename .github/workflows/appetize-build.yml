name: Build for Appetize.io

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build for iOS Simulator
        # Собираем под generic симулятор и принудительно для всех архитектур
        run: |
          xcodebuild build \
            -project FlashcardsApp.xcodeproj \
            -scheme FlashcardsApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Prepare Payload for Appetize
        # Копируем .app в отдельную папку, чтобы GitHub правильно ее запаковал
        run: |
          mkdir -p ${{ github.workspace }}/Payload
          cp -R ${{ github.workspace }}/build/FlashcardsApp.app ${{ github.workspace }}/Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashcardsApp
          path: ${{ github.workspace }}/Payload/
