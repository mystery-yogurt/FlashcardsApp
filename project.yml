name: FlashcardsApp
options:
  bundleIdPrefix: com.example
packages:
  Realm:
    url: https://github.com/realm/realm-swift.git
    from: 10.45.0
targets:
  FlashcardsApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - package: Realm
        product: RealmSwift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.FlashcardsApp"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Разрешите доступ к камере для сканирования новых слов."
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
